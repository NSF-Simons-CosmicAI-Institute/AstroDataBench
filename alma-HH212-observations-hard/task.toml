schema_version = "1.2"
artifacts = ["/app/answer.md"]

[task]
name = "STABLE/alma-HH212-observations-hard"
description = "Give me a summary of the Band 7 data from any project that can be used for creating a deep, high-resolution (better than 1 arcsec) image of the continuum."
authors = []
keywords = ["alma", "query"]

[metadata] # metadata that isn't actually used in the running / grading
difficulty_explanation = "hard"
category = "data-query"

[environment] # Used at build time (before the agent and verifier run) to set the container conditions
build_timeout_sec = 600.0
network_mode = "public"
os = "linux"
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
mcp_servers = []
ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY}"

[agent] # Controls sandbox conditions as the agent is running (overrides the environment baseline only during the agent's turn)
timeout_sec = 600.0
network_mode = "allowlist"
allowed_hosts = [
  "almascience.org", "*almascience.org",
  "almascience.nrao.edu", "*almascience.nrao.edu",
  "almascience.eso.org", "*almascience.eso.org",
  "pypi.org", "files.pythonhosted.org",
]

[verifier]
timeout_sec = 600.0
network_mode = "allowlist"
allowed_hosts = [
  "almascience.nrao.edu", "*.almascience.nrao.edu",
  "almascience.eso.org", "*.almascience.eso.org",
  "api.anthropic.com",
]
