[judge]
judge = "anthropic/claude-sonnet-4-6"
files = ["/app/answer.md"]

[[criterion]]
description = """
Does the answer address whether combining data from multiple ALMA
projects/observations of HH212 could produce a deeper continuum image?
"""
type = "binary"

[[criterion]]
description = """
Does the answer raise at least one calibration or compatibility
consideration relevant to using or combining this ALMA data (e.g. differing
array configurations, differing spectral setups, epoch differences)?
"""
type = "binary"

[[criterion]]
description = """
Rate the overall quality and specificity of the answer's astronomical
reasoning about continuum imaging suitability, on a scale where 1 =
generic/vague statements not grounded in specific data, and 5 = specific,
well-justified reasoning that references actual reported values (resolution,
bandwidth, integration time).
"""
type = "likert"
points = 5
weight = 2.0