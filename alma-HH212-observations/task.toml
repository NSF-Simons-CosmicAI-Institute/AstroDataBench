schema_version = "1.2"
artifacts = ["/app/output.json"]

[task]
name = "STABLE/alma-HH212-observations"
description = "Find available Band 6 and 7 observations for HH 212, with angular resolution < 1 arcsec"
authors = []
keywords = ["alma", "query"]

[metadata] # metadata that isn't actually used in the running / grading
difficulty_explanation = "easy: single step; task and expected output format are very explicitly defined"
category = "data-query"

[environment] # Used at build time (before the agent and verifier run) to set the container conditions
build_timeout_sec = 600.0
network_mode = "public"
os = "linux"
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
mcp_servers = []
ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY}"

[agent] # Controls sandbox conditions as the agent is running (overrides the environment baseline only during the agent's turn)
timeout_sec = 600.0
network_mode = "allowlist"
allowed_hosts = [
  "almascience.org", "*almascience.org",
  "almascience.nrao.edu", "*almascience.nrao.edu",
  "almascience.eso.org", "*almascience.eso.org",
  "pypi.org", "files.pythonhosted.org",
]

[verifier] # Controls conditions for verification (test.sh)
timeout_sec = 600.0
network_mode = "allowlist"
allowed_hosts = [
  "almascience.org", "*almascience.org",
  "almascience.nrao.edu", "*almascience.nrao.edu",
  "almascience.eso.org", "*almascience.eso.org",
]

#[environment.env]

#[solution.env]
