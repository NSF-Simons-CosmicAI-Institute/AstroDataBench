id: aperture_vs_psf_photometry
category: cross-regime
prompt: |
  What's the difference between PSF magnitude and aperture magnitude in a catalog like SDSS DR17, and when should I use one over the other?
checklist:
  - id: photometry
    text: Explains that both aperture photometry and PSF photometry are methods of
          estimating the magnitude or total flux density of an astronomical source 
          from an image.
    summary: Both are methods for estimating a target source's magnitude or total flux density.
    weight: 1.0
  - id: aper_phot
    text: Explains that aperture photometry sums pixel values within a defined aperture 
          (often circular) centered on the target source.
    summary: Aperture photometry sums pixel counts within a defined region around the source.
    weight: 1.0
  - id: aper_phot_bkgsub
    text: Mentions that in aperture photometry, the local sky background is estimated (may
          note that this is often done using an annulus around the source) and subtracted from
          the aperture counts to obtain a background-subtracted flux.
    summary: Aperture photometry subtracts local sky background contribution.
    weight: 0.5
  - id: psf_phot
    text: Explains that PSF photometry models the instrument's point spread function (PSF) 
          and fits this model to the target pixels to derive the source's flux.
    summary: PSF photometry fits a PSF model to the source to estimate flux.
    weight: 1.0
  - id: environment
    text: Mentions that PSF photometry performs well in crowded fields because it can fit 
          multiple overlapping profiles simultaneously, whereas aperture photometry can 
          suffer from flux contamination from neighboring sources in these environments.
    summary: PSF photometry performs well in crowded fields where aperture photometry can struggle.
    weight: 1.0
  - id: morphology
    text: Mentions that PSF photometry assumes the target is an unresolved point source 
          (e.g., stars or distant quasars) and will systematically underestimate flux 
          if applied to extended sources. (e.g., galaxies, comets, circumstellar disks). 
    summary: PSF photometry assumes a point source and is not well-suited for extended objects.
    weight: 1.0
  - id: galaxy_mag
    text: Clarifies that BOTH the PSF magnitude AND the simple fixed-aperture magnitude in 
          SDSS DR17 are inadequate for extended galaxies (due to truncation or excess sky noise); 
          OR, suggests other SDSS DR17 measurements like composite model magnitude (cModelMag), or  
          Petrosian magnitude (petroMag) for galaxies.
    summary: Neither PSF or aperture photometry is ideal for galaxies.
    weight: 0.5
  - id: conditionality
    text: Avoids calling one method universally superior, instead justifying the 
          choice based on factors like object morphology and environmental crowding.
    summary: Does not claim one method is universally better without the environment / morphology caveat.
    weight: 0.75

